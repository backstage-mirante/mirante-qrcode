version: 2
updates:
  # O bun.lock está na versão 2 do formato, gravada pelo Bun 1.4.
  # O Dependabot instala o Bun 1.3.14 e lê o formato somente até a versão 1,
  # então este job falha até o dependabot-core atualizar o binário e o limite.
  # Contexto: https://github.com/dependabot/dependabot-core/pull/15896
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # electron-vite 5 aceita Vite apenas até a major 7. O plugin React 6 exige
      # Vite 8; remover estes bloqueios assim que electron-vite declarar suporte.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
