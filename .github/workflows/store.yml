name: Preparar pacote para Microsoft Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validar e gerar MSIX x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REQUIRE_WINDOWS_SIGNING: "false"
      STORE_PACKAGE_IDENTITY: ${{ vars.STORE_PACKAGE_IDENTITY }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # electron-vite e electron-builder executam sobre Node.js durante o empacotamento.
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configurar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Instalar dependências reproduzíveis
        run: bun install --frozen-lockfile

      # O Bun não oferece verificação de assinaturas do registro. A auditoria de
      # vulnerabilidades abaixo substitui a etapa `npm audit signatures`.
      - name: Auditar toda a árvore de dependências
        run: bun audit --audit-level=high

      - name: Validar identidade atribuída pelo Partner Center
        shell: bash
        run: |
          required=(
            STORE_PACKAGE_IDENTITY
            STORE_PUBLISHER
            STORE_PUBLISHER_DISPLAY_NAME
          )

          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuração ausente: ${name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Verificar projeto
        run: bun run check

      - name: Gerar MSIX para ingestão da Store
        run: bun run package:store

      - name: Guardar pacote MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store-msix-${{ github.sha }}
          path: release-msix/*.msix
          if-no-files-found: error
          retention-days: 14
