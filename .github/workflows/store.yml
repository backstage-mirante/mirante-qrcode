name: Preparar pacote para Microsoft Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validar e gerar MSIX x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REQUIRE_WINDOWS_SIGNING: "false"
      STORE_PACKAGE_IDENTITY: ${{ vars.STORE_PACKAGE_IDENTITY }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Auditar toda a árvore de dependências
        run: npm audit --audit-level=high

      - name: Verificar assinaturas do registro npm
        run: npm audit signatures

      - name: Validar identidade atribuída pelo Partner Center
        shell: bash
        run: |
          required=(
            STORE_PACKAGE_IDENTITY
            STORE_PUBLISHER
            STORE_PUBLISHER_DISPLAY_NAME
          )

          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuração ausente: ${name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Verificar projeto
        run: npm run check

      - name: Gerar MSIX para ingestão da Store
        run: npm run package:store

      - name: Guardar pacote MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microsoft-store-msix-${{ github.sha }}
          path: release-msix/*.msix
          if-no-files-found: error
          retention-days: 14
