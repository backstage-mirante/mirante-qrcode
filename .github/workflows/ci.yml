name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # electron-vite executa sobre Node.js durante o build do desktop.
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Configurar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Instalar dependências reproduzíveis
        run: bun install --frozen-lockfile

      # O Bun não oferece verificação de assinaturas do registro. A auditoria de
      # vulnerabilidades abaixo substitui a etapa `npm audit signatures`.
      - name: Auditar toda a árvore de dependências
        run: bun audit --audit-level=high

      - name: Verificar projeto
        run: bun run check
